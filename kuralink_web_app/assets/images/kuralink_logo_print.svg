<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGradPrint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#00D4B2" />
    </linearGradient>
    <linearGradient id="accentGradPrint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4B2" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="textGradPrint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00B89C" />
    </linearGradient>
    <filter id="subtleShadowPrint" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background container (clean transparent) -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Logo Symbol (Gailu Biomedikoak + Pultsua + Multiplataforma K Nodoa) -->
  <g transform="translate(40, 30)" filter="url(#subtleShadowPrint)">
    <!-- Rounded Background Badge for the Icon -->
    <rect x="0" y="0" width="200" height="200" rx="46" fill="#0A192F" />

    <!-- Outer tech subtle ring -->
    <circle cx="100" cy="100" r="82" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-dasharray="6 6" />

    <!-- Connected nodes ring / IoT data links -->
    <circle cx="100" cy="35" r="4.5" fill="#00D4B2" />
    <circle cx="165" cy="100" r="4.5" fill="#0EA5E9" />
    <circle cx="100" cy="165" r="4.5" fill="#0284C7" />
    <circle cx="35" cy="100" r="4.5" fill="#10B981" />

    <!-- Stylized Modern 'K' intertwined with vital pulse (EKG) and neural link -->
    <!-- Stem of K: Medical capsule & data column -->
    <rect x="62" y="52" width="16" height="96" rx="8" fill="url(#primaryGradPrint)" />

    <!-- Upper branch of K: angled link node -->
    <path d="M74 100 L128 54 C132 50 139 52 141 57 L143 61 C145 66 143 72 139 76 L94 112 Z" fill="url(#primaryGradPrint)" />

    <!-- Lower branch of K transitioning into vital rhythm pulse wave -->
    <path d="M82 104 L114 134 L126 116 L136 142 L144 128 L152 134" 
          stroke="url(#accentGradPrint)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Active vital node -->
    <circle cx="152" cy="134" r="6" fill="#00D4B2" />
    <circle cx="152" cy="134" r="10" fill="#00D4B2" opacity="0.3" />
  </g>

  <!-- Typography: Brand Name -->
  <g transform="translate(275, 118)">
    <!-- "Kura" in Deep Navy (#0A192F) for High Contrast on Light Backgrounds -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
          font-size="82" font-weight="900" fill="#0A192F" letter-spacing="-1.5">Kura</text>
    
    <!-- "Link" in Medical Gradient -->
    <text x="202" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" 
          font-size="82" font-weight="800" fill="url(#textGradPrint)" letter-spacing="-1.5">Link</text>

    <!-- Subtitle: Category & Specialization -->
    <text x="4" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Open Sans', sans-serif" 
          font-size="19" font-weight="700" fill="#475569" letter-spacing="5.5">HEALTH TECHNOLOGIES</text>

    <!-- Tagline / Slogan in Basque -->
    <text x="5" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Open Sans', sans-serif" 
          font-size="15" font-weight="600" fill="#0284C7" letter-spacing="1.2">Software Biomedikoa &amp; Gailu Adimendunen Sinkronizazioa</text>
  </g>
</svg>
