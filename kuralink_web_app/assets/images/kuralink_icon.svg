<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#00D4B2" />
    </linearGradient>
    <linearGradient id="iconAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4B2" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#00D4B2" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background App Icon Shape (Smooth Superellipse / Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="115" fill="url(#bgGrad)" />

  <!-- Outer tech orbital line -->
  <circle cx="256" cy="256" r="190" stroke="#3A506B" stroke-width="3" fill="none" stroke-dasharray="10 10" opacity="0.6" />

  <!-- Satellite Connection Nodes (IoT / Multiplatform Concept) -->
  <circle cx="256" cy="95" r="9" fill="#00D4B2" />
  <circle cx="417" cy="256" r="9" fill="#0EA5E9" />
  <circle cx="256" cy="417" r="9" fill="#0284C7" />
  <circle cx="95" cy="256" r="9" fill="#10B981" />

  <!-- Central Symbol Group -->
  <g filter="url(#iconGlow)">
    <!-- Stem of 'K' (Biomedical Column) -->
    <rect x="165" y="145" width="34" height="222" rx="17" fill="url(#iconPrimaryGrad)" />

    <!-- Top arm of 'K' (Digital Link) -->
    <path d="M190 256 L310 150 C320 141 336 145 340 157 L344 167 C348 178 344 191 334 200 L235 282 Z" fill="url(#iconPrimaryGrad)" />

    <!-- Bottom arm of 'K' transformed into Heartbeat Pulse (EKG) + Telemetry -->
    <path d="M210 265 L275 330 L300 292 L322 346 L339 316 L360 330" 
          stroke="url(#iconAccentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Active Pulsing Node (Patient Vital Point) -->
    <circle cx="360" cy="330" r="13" fill="#00D4B2" />
    <circle cx="360" cy="330" r="22" fill="#00D4B2" opacity="0.35" />
  </g>
</svg>
